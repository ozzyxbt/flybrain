name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
      - name: Deterministic Gate A fixture run + verifier
        run: |
          python -m flybrain run --manifest manifests/gate-a-demo-v1.json --out runs/ci --run-id ci --quiet
          python -m flybrain verify-run runs/ci --resimulate
